<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Zoom manual bloqueado. La escala inicial se mantiene fija. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.15, maximum-scale=1.15, minimum-scale=1.15, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Cierre de caja</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: manipulation;
    }

    #cajaApp {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <div id="app">
    <iframe
      id="cajaApp"
      src="https://script.google.com/macros/s/AKfycbzkBNN_H7YXI-Ke5FtO7m8yVcYySXZ6PXcwsdKcY9v_5cq-HEWG1x3Bx6_zLWhQWrBqtg/exec"
      title="Cierre de caja"
      allow="fullscreen; clipboard-read; clipboard-write"
      scrolling="auto">
    </iframe>
  </div>

  <script>
    // Bloqueo de zoom manual.
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, {passive:false});

    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    }, {passive:false});

    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    }, {passive:false});

    let ultimoToque = 0;
    document.addEventListener('touchend', function(e) {
      const ahora = Date.now();
      if (ahora - ultimoToque < 300) {
        e.preventDefault();
      }
      ultimoToque = ahora;
    }, {passive:false});

    /*
     * Corrección específica para Fold/pantalla exterior.
     *
     * Al arrancar directamente en la pantalla exterior, Android puede
     * entregar inicialmente un viewport distinto del definitivo. El
     * iframe queda visualmente en un sitio, pero las coordenadas táctiles
     * se calculan con las dimensiones iniciales.
     *
     * Forzamos varios recalculos al arrancar y después de cada resize.
     */
    (function () {
      const iframe = document.getElementById('cajaApp');

      function recalcularViewport() {
        if (!iframe) return;

        const ancho = window.visualViewport
          ? window.visualViewport.width
          : window.innerWidth;

        const alto = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

        document.documentElement.style.width = ancho + 'px';
        document.documentElement.style.height = alto + 'px';
        document.body.style.width = ancho + 'px';
        document.body.style.height = alto + 'px';

        iframe.style.width = ancho + 'px';
        iframe.style.height = alto + 'px';

        // Forzamos un reflow para que Android/WebView recalcule
        // correctamente la zona táctil.
        void iframe.offsetHeight;
      }

      function recalcularConRetardo() {
        recalcularViewport();
        requestAnimationFrame(recalcularViewport);
        setTimeout(recalcularViewport, 100);
        setTimeout(recalcularViewport, 300);
        setTimeout(recalcularViewport, 600);
        setTimeout(recalcularViewport, 1000);
      }

      window.addEventListener('load', recalcularConRetardo);
      window.addEventListener('resize', recalcularConRetardo);
      window.addEventListener('orientationchange', recalcularConRetardo);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', recalcularConRetardo);
      }

      // También ejecutamos una vez inmediatamente por si la PWA ya está
      // visible antes de que se dispare load.
      recalcularConRetardo();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function () {});
      });
    }
  </script>
</body>
</html>

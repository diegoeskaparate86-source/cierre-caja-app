<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Zoom manual bloqueado. La escala inicial se mantiene fija. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.15, maximum-scale=1.15, minimum-scale=1.15, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Cierre de caja</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: manipulation;
    }


    /* Ajuste específico para pantallas estrechas/verticales del Fold.
       No transforma el iframe: dejamos que el navegador mantenga las
       coordenadas táctiles en el mismo sistema de referencia. */
    @media (max-width: 700px) and (orientation: portrait) {
      html, body, #app, #cajaApp {
        width: 100%;
        max-width: 100%;
      }
    }

    #cajaApp {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <div id="app">
    <iframe
      id="cajaApp"
      src="https://script.google.com/macros/s/AKfycbzkBNN_H7YXI-Ke5FtO7m8yVcYySXZ6PXcwsdKcY9v_5cq-HEWG1x3Bx6_zLWhQWrBqtg/exec"
      title="Cierre de caja"
      allow="fullscreen; clipboard-read; clipboard-write"
      scrolling="auto">
    </iframe>
  </div>

  <script>
    // Evita gestos de zoom del navegador dentro de la PWA.
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, {passive:false});

    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    }, {passive:false});

    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    }, {passive:false});

    // Evita el doble toque que algunos navegadores interpretan como zoom.
    let ultimoToque = 0;
    document.addEventListener('touchend', function(e) {
      const ahora = Date.now();
      if (ahora - ultimoToque < 300) {
        e.preventDefault();
      }
      ultimoToque = ahora;
    }, {passive:false});

    // En el Fold, al arrancar directamente en la pantalla exterior,
    // el viewport puede terminar de establecerse unos instantes después.
    // Solo provocamos un reflow; no cambiamos la escala ni la geometría.
    function reflowFold() {
      void document.body.offsetHeight;
      void document.getElementById('cajaApp').offsetHeight;
    }

    window.addEventListener('load', function () {
      reflowFold();
      setTimeout(reflowFold, 150);
      setTimeout(reflowFold, 500);
      setTimeout(reflowFold, 1000);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', reflowFold);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function () {});
      });
    }
  </script>
</body>
</html>
